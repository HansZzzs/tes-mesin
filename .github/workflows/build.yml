name: Build EngineSound Pro APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'EngineSoundPro_AndroidStudio_Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip EngineSoundPro_AndroidStudio_Project.zip -d project

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EngineSoundPro-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
